{
	"build_cache": true,
	"files": [
		"contracts/core/EntryPoint.sol"
	],
	"hashing_length_bound": "96",
	"loop_iter": "1",
	"msg": "EntryPoint nonce used one time",
	"optimistic_fallback": true,
	"optimistic_hashing": true,
	"optimistic_loop": true,
	"packages": [
		"@openzeppelin=node_modules/@openzeppelin",
		"@uniswap=node_modules/@uniswap"
	],
	"precise_bitwise_ops": true,
	"process": "emv",
	"prover_args": [
		"-assumeFPStrictlyMonotonic false",
		"-enableSolidityBasedInlining true",
	],
	"rule_sanity": "basic",
	"smt_timeout": "1800",
	"verify": "EntryPoint:certora/specs/nonceOneTime.spec",
}