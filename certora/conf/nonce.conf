{
	"build_cache": true,
	"files": [
		"certora/harness/NonceHarness.sol" // harness needed to wrap an internal function
	],
	"hashing_length_bound": "96",
	"loop_iter": "1",
	"msg": "EntryPoint nonce",
	"optimistic_fallback": true,
	"optimistic_hashing": true,
	"optimistic_loop": true,
	"packages": [
		"@openzeppelin=node_modules/@openzeppelin",
		"@uniswap=node_modules/@uniswap"
	],
	"precise_bitwise_ops": true,
	"process": "emv",
	"prover_args": [
		"-assumeFPStrictlyMonotonic false",
		"-enableSolidityBasedInlining true",
		"-s z3",
	//	"-destructiveOptimizations enable",
	],
	"rule_sanity": "basic",
	"smt_timeout": "1800",
	"verify": "NonceHarness:certora/specs/nonce.spec",
}